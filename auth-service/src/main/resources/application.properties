# Application Configuration
spring.application.name=auth-service
server.port=8082

# Database Configuration (MySQL)
# MySQL Database
spring.datasource.url=jdbc:mysql://localhost:3306/furnish_auth_db?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=rootuser
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# H2 Database (Development) - Commented out for MySQL migration
#spring.datasource.url=jdbc:h2:mem:authdb
#spring.datasource.driverClassName=org.h2.Driver
#spring.datasource.username=sa
#spring.datasource.password=password
#spring.h2.console.enabled=true
#spring.h2.console.path=/h2-console

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
# For H2, use: org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
auth.jwt.secret=your-super-secret-jwt-key-that-should-be-at-least-256-bits-long-for-production
auth.jwt.expiration=86400

# Logging Configuration
logging.level.com.furnish.webapp.auth=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Actuator Configuration
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# CORS Configuration (can also be set via environment variables)
cors.allowed-origins=http://localhost:3000,http://localhost:3001,https://home-design-hub.preview.emergentagent.com

# Application Information
info.app.name=@project.name@
info.app.description=Authentication and User Management Service
info.app.version=@project.version@

# Springdoc OpenAPI (Swagger) Configuration
springdoc.api-docs.path=/api/docs
springdoc.swagger-ui.path=/api/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.disable-swagger-default-url=true
