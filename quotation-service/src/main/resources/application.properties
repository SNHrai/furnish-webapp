# Server Configuration
server.port=8083

# Application Configuration
spring.application.name=quotation-service

# Database Configuration - MySQL (Production)
spring.datasource.url=jdbc:mysql://localhost:3306/furnish_quotations?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=rootuser
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.format-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# MySQL Configuration
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.globally_quoted_identifiers=true

# Security Configuration
jwt.secret=your-very-long-secret-key-that-should-be-at-least-32-characters-long
jwt.expiration=86400000

# Python Auth Service Configuration
python-auth.base-url=http://localhost:8000

# Email Service Configuration
email-service.base-url=http://localhost:8081

# File Storage Configuration
quotation.pdf.storage-path=./pdfs/

# Logging Configuration
logging.level.com.furnish.webapp.quotationservice=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# CORS Configuration
cors.allowed-origins=http://localhost:3000,http://localhost:3001
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
cors.allowed-headers=*
cors.allow-credentials=true

# JSON Configuration
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC